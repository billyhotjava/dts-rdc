# Keycloak edge vhost on the Aliyun hub; upstream dts-sso-keycloak on 10.20.0.50:18081.
server {
    listen 80;
    listen [::]:80;
    server_name sso.yuzhicloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sso.yuzhicloud.com;

    ssl_certificate /etc/letsencrypt/live/sso.yuzhicloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.yuzhicloud.com/privkey.pem;

    # Keycloak sends large cookies/headers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://10.20.0.50:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}

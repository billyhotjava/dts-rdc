# Shared Keycloak (OIDC SSO) on 10.20.0.50, published as https://sso.yuzhicloud.com
# through the Aliyun edge nginx (TLS terminates there).
name: dts-sso
services:
  sso-db:
    image: postgres:17-alpine
    container_name: dts-sso-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD:?set in .env}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: dts-sso-keycloak
    restart: unless-stopped
    command: ["start"]
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sso-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SSO_DB_PASSWORD}
      KC_HOSTNAME: https://sso.yuzhicloud.com
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SSO_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD:?set in .env}
      TZ: Asia/Shanghai
    ports:
      - "18081:8080"
    volumes:
      - ./bootstrap:/opt/keycloak/bootstrap:ro

# Portainer CE on 10.20.0.50 (container management UI, https://10.20.0.50:19443 over WireGuard).
# Replaces the earlier hand-started `docker run` container; name, ports, volume and socket are unchanged.
name: portainer
services:
  portainer:
    image: portainer/portainer-ce:2.45.1
    container_name: portainer
    restart: always
    ports:
      - "18000:8000"
      - "19443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true

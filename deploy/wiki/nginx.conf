# Static server for the DTS wiki plus /api routing. Sits behind oauth2-proxy (wiki-auth);
# TLS and public exposure live on the Aliyun edge nginx.
#
# Site layout (see wiki/scripts/build.mjs):
#   /            portal (home, search, editor, status, sandbox)
#   /p/<slug>/   product site; every request is authorised by wiki-api (/api/authz) against
#                the user's Keycloak role dts-wiki:space-<slug>
server {
    listen 80;
    server_name _;
    charset utf-8;
    # relative Location headers: TLS terminates at the edge, nginx only sees http
    absolute_redirect off;
    root /site/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://wiki-api:8080;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }

    location = /_authz {
        internal;
        proxy_pass http://wiki-api:8080/api/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /_status.json {
        alias /site/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # product sites: authorised per request (pages, hashed chunks and search index alike)
    location ^~ /p/ {
        auth_request /_authz;
        error_page 403 = @forbidden;
        location ~ ^/p/[^/]+/assets/ {
            auth_request /_authz;
            add_header Cache-Control "private, max-age=31536000, immutable";
            try_files $uri =404;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location @forbidden {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 403 '<!doctype html><meta charset="utf-8"><title>无权访问</title><body style="font-family:sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#333"><h2>无权访问该产品空间</h2><p>请联系管理员把你加入对应的“产品-”组。</p><p><a href="/">返回首页</a></p></body>';
    }

    # URLs before product sites existed
    location ^~ /docs/    { return 301 /p/dts$request_uri; }
    location ^~ /worklog/ { return 301 /p/dts$request_uri; }
    location ~ ^/products/([a-z][a-z0-9-]*)/(docs|worklog)/(.*)$ { return 301 /p/$1/$2/$3$is_args$args; }

    # hashed portal assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

# Static server for the DTS wiki plus /api routing. Sits behind oauth2-proxy (wiki-auth);
# TLS and public exposure live on the Aliyun edge nginx.
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /site/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://wiki-api:8080;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }

    location = /_status.json {
        alias /site/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

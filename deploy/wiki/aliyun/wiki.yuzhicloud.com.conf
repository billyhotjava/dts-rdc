# DTS wiki edge vhost on the Aliyun hub (10.20.0.1 / 39.106.43.56).
# Upstream: dts-wiki-web on 10.20.0.50:18090 over WireGuard.
# Stage 1 (now): HTTP only. Stage 2: after DNS resolves, run
#   certbot certonly --webroot -w /var/www/certbot -d wiki.yuzhicloud.com
# then switch to wiki.yuzhicloud.com.ssl.conf.
server {
    listen 80;
    listen [::]:80;
    server_name wiki.yuzhicloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://10.20.0.50:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

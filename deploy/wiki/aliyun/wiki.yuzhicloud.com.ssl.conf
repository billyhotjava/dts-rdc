# Stage 2 vhost: HTTPS (certificate from certbot). Access control is added later.
server {
    listen 80;
    listen [::]:80;
    server_name wiki.yuzhicloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wiki.yuzhicloud.com;

    ssl_certificate /etc/letsencrypt/live/wiki.yuzhicloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.yuzhicloud.com/privkey.pem;

    location / {
        proxy_pass http://10.20.0.50:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

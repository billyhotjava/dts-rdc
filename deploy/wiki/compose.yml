# DTS wiki on 10.20.0.50, published as https://wiki.yuzhicloud.com via the Aliyun edge.
#   edge nginx (TLS) -> wiki-auth (oauth2-proxy, Keycloak realm "yuzhicloud") -> wiki-web (nginx)
#                                                     /api -> wiki-api (edit, upload, git sync, build)
# Only wiki-auth publishes a port; wiki-web and wiki-api trust the identity headers it injects.
name: dts-wiki
services:
  wiki-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: dts-wiki-auth
    restart: unless-stopped
    depends_on: [wiki-web]
    ports:
      - "18090:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://sso.yuzhicloud.com/realms/yuzhicloud
      OAUTH2_PROXY_CLIENT_ID: dts-wiki
      OAUTH2_PROXY_CLIENT_SECRET: ${WIKI_OIDC_CLIENT_SECRET:?set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${WIKI_COOKIE_SECRET:?set in .env}
      OAUTH2_PROXY_COOKIE_NAME: _dts_wiki
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      OAUTH2_PROXY_COOKIE_REFRESH: 30m
      OAUTH2_PROXY_REDIRECT_URL: https://wiki.yuzhicloud.com/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://wiki-web:80
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # only the Aliyun edge (WireGuard 10.20.0.1) may supply X-Forwarded-* headers
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 10.20.0.1/32
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_ALLOWED_ROLES: dts-wiki:reader
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_WHITELIST_DOMAINS: .yuzhicloud.com
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/favicon.svg$"
      TZ: Asia/Shanghai

  wiki-web:
    image: nginx:1.28-alpine
    container_name: dts-wiki-web
    restart: unless-stopped
    depends_on: [wiki-api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/site:ro

  wiki-api:
    image: dts-wiki-api:1
    container_name: dts-wiki-api
    restart: unless-stopped
    environment:
      GIT_URL: ${GIT_URL:-git@github.com:billyhotjava/dts-rdc.git}
      BRANCH: ${BRANCH:-main}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-120}
      KEEP_RELEASES: ${KEEP_RELEASES:-5}
      EDITOR_ROLE: dts-wiki:editor
      ADMIN_ROLE: dts-wiki:admin
      TZ: Asia/Shanghai
    volumes:
      - ./repo:/repo
      - ./site:/site
      - ./cache:/cache
      - ./secrets:/secrets:ro

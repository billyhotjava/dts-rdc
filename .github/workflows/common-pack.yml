name: Common Pack contracts
on:
  pull_request:
    paths: ['dts-common/**', '.github/workflows/common-pack.yml']
  push:
    paths: ['dts-common/**', '.github/workflows/common-pack.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: dts-common/pom.xml
      - run: ./dts-common/build.sh verify
      - uses: actions/upload-artifact@v4
        with:
          name: dts-common-pack-1.1.0
          path: |
            dts-common/pom.xml
            dts-common/target/dts-common-pack-1.1.0*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-test-results
          path: dts-common/target/surefire-reports/
